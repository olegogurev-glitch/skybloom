<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3d9cf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Skybloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#120e2a;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:'Fredoka','Nunito',system-ui,-apple-system,sans-serif;}
  #wrap{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;container-type:size;
    background:linear-gradient(#62bdf9,#ffe4c8);
    box-shadow:0 0 80px rgba(0,0,0,.5);}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #hud{position:absolute;inset:0;pointer-events:none;color:#fff;transition:opacity .4s;}
  #hud.hidden{opacity:0}
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;}
  #alt{font-weight:700;font-size:42px;line-height:1;letter-spacing:-.5px;
    text-shadow:0 2px 0 rgba(40,20,90,.18),0 4px 18px rgba(30,20,80,.35);}
  #alt small{font-size:18px;opacity:.85;margin-left:3px}
  #combo{margin-top:8px;display:inline-block;padding:4px 12px;border-radius:999px;font-weight:600;font-size:14px;
    background:rgba(255,255,255,.24);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;transform:scale(.7);transform-origin:left center;transition:opacity .2s,transform .2s;}
  #combo.on{opacity:1;transform:scale(1)}
  #combo.pop{animation:pop .35s}
  #combo.gold{background:linear-gradient(90deg,#ffd34d,#ff9f43);color:#5a2470;box-shadow:0 0 18px rgba(255,200,60,.7)}
  .right{display:flex;gap:8px;align-items:center}
  .chip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:600;font-size:17px;
    background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    text-shadow:0 1px 4px rgba(30,20,80,.3);}
  .seedDot{width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fffbe0,#ffd34d 55%,#e8930f);box-shadow:0 0 10px #ffd34d}
  #mute{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;
    background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;cursor:pointer;padding:0}
  #mute svg{width:18px;height:18px}
  .roundBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;cursor:pointer;
    background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .roundBtn svg{width:16px;height:16px}
  #pause{background:rgba(20,10,50,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding-top:30vh}
  #pause h2{margin:0;font-size:44px;font-weight:700;text-shadow:0 4px 20px rgba(20,10,60,.5)}
  /* compact bloom bar: one small pill, dimmed unless it matters right now */
  .bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    display:flex;flex-direction:column;align-items:stretch;gap:5px;padding:6px 8px 7px;border-radius:24px;
    background:rgba(30,20,80,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:.5;transition:opacity .35s;}
  .bottom.active{opacity:1}
  #charges{display:flex;gap:6px}
  #charges.shake{animation:shake .4s}
  .slot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:background .3s,box-shadow .3s,transform .3s;}
  .slot svg{width:22px;height:22px;opacity:.28;filter:grayscale(1) brightness(1.6);transition:opacity .3s,filter .3s,transform .3s;transform:scale(.8)}
  .slot.full{background:rgba(255,150,205,.32);box-shadow:0 0 18px rgba(255,140,200,.65)}
  .slot.full svg{opacity:1;filter:none;transform:scale(1)}
  .slot.gain{animation:gain .5s}
  #charges.urge .slot.full{animation:urge .42s ease-in-out infinite}
  @keyframes urge{50%{transform:scale(1.22);box-shadow:0 0 28px rgba(255,140,200,1)}}
  #meter{height:4px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
  #meter i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#ffd34d,#ff8fc8);transition:width .25s}
  #hint{position:absolute;left:0;right:0;top:68%;font-size:15px;font-weight:600;opacity:0;color:#fff;pointer-events:none;transition:opacity .5s;text-shadow:0 1px 6px rgba(30,20,80,.5);text-align:center;padding:0 20px}
  #hint.on{opacity:.95}
  #banner{position:absolute;left:0;right:0;top:24%;text-align:center;color:#fff;pointer-events:none;
    font-weight:700;font-size:30px;letter-spacing:.5px;opacity:0;transform:translateY(10px);
    text-shadow:0 2px 0 rgba(40,20,90,.2),0 6px 24px rgba(30,20,80,.5);transition:opacity .6s,transform .6s}
  #banner small{display:block;font-size:13px;font-weight:600;letter-spacing:3px;opacity:.8;text-transform:uppercase;margin-bottom:4px}
  #banner.show{opacity:1;transform:none}

  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 13vh) 16px 0;box-sizing:border-box;text-align:center;color:#fff;
    transition:opacity .45s;}
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay.hidden *{pointer-events:none!important}
  .title{font-size:64px;font-size:17cqw;font-weight:700;letter-spacing:-1px;line-height:.9;margin:0;
    color:#fff;text-shadow:0 3px 0 #e48fc4,0 6px 0 rgba(120,50,150,.35),0 14px 30px rgba(70,30,140,.45);
    animation:float 3.2s ease-in-out infinite}
  .title span{display:inline-block;animation:wave 2.4s ease-in-out infinite}
  .sub{margin-top:14px;font-size:17px;font-weight:600;opacity:.95;text-shadow:0 1px 8px rgba(40,20,100,.55)}
  .btn{pointer-events:auto;margin-top:28px;padding:15px 46px;border:0;border-radius:999px;cursor:pointer;
    font:700 23px 'Fredoka','Nunito',system-ui,sans-serif;color:#6a2c7e;background:linear-gradient(180deg,#fff,#ffe1f2);
    box-shadow:0 6px 0 #ec9fd0,0 16px 34px rgba(90,40,140,.4);animation:breathe 2s ease-in-out infinite;}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #ec9fd0,0 8px 18px rgba(90,40,140,.35);animation:none}
  #menu{padding-top:calc(env(safe-area-inset-top,0px) + 7vh)}
  #menu .btn{margin-top:20px}
  .howto{margin-top:18px;display:flex;gap:6px;font-size:12.5px;font-weight:500;max-width:350px;width:100%}
  .howto div{background:rgba(40,25,100,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    padding:9px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.18);text-align:left;display:flex;gap:10px;align-items:center}
  .howto b{font-weight:700}
  .howto .ic{font-size:18px;text-align:center;flex:none}
  .howto div{flex:1;flex-direction:column!important;text-align:center!important;gap:4px!important;padding:8px 6px!important;line-height:1.2}
  .best{margin-top:12px;font-weight:600;font-size:15px;opacity:.9;text-shadow:0 1px 6px rgba(40,20,100,.5)}
  .card{margin-top:6vh;padding:26px 30px 30px;border-radius:30px;min-width:240px;
    background:rgba(25,15,70,.42);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(10,5,40,.45);}
  .card h2{margin:0;font-size:16px;font-weight:600;letter-spacing:3px;text-transform:uppercase;opacity:.8}
  .big{font-size:76px;font-weight:700;line-height:1;margin:8px 0 2px;letter-spacing:-2px}
  .big small{font-size:28px;letter-spacing:0;opacity:.8}
  .newbest{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px;
    background:linear-gradient(90deg,#ffd34d,#ff8fc8);color:#5a2470;letter-spacing:1px;animation:pop .6s}
  .card{position:relative}
  .pipwrap{margin:-74px auto 2px;width:78px;animation:pipsad 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(10,5,40,.4))}
  .zone{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;font-weight:600;font-size:13px;letter-spacing:.5px;
    border:1px solid rgba(255,255,255,.35);text-shadow:0 1px 4px rgba(20,10,60,.5)}
  .tobest{margin-top:14px;font-size:13px;font-weight:600;opacity:.9}
  .tobest .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:0 auto 6px;width:190px}
  .tobest .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#7deccb,#ff8fc8)}
  /* phone buttons: half-transparent glass, like other mobile games */
  #pad{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;pointer-events:none}
  #pad[hidden]{display:none}
  .padBtn{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;display:grid;place-items:center;padding:0;color:#fff;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.17);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    box-shadow:0 4px 18px rgba(20,10,60,.18),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,background .12s,box-shadow .12s}
  .padBtn.round{width:78px;height:78px;border-radius:50%}
  .padBtn.round svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 1px 3px rgba(20,10,60,.4))}
  .padBtn.rect{width:132px;height:64px;border-radius:20px}
  .padBtn.down{transform:scale(.92);background:rgba(255,255,255,.4);box-shadow:0 0 24px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,.55)}
  .padBtn.off{opacity:.35}
  #hud.hidden .padBtn{pointer-events:none}
  /* inside the middle button the flower charges lose their own pill */
  #padB #bloomBar{position:static;transform:none;opacity:1;background:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:6px}
  #padB .slot{width:30px;height:30px;background:rgba(255,255,255,.14)}
  #padB .slot svg{width:21px;height:21px}
  #padB #meter{height:4px}
  .ctrlSwitch{pointer-events:auto;margin-top:26px;display:flex;align-items:center;gap:6px;padding:5px;border-radius:999px;
    background:rgba(255,255,255,.14);font-weight:600;font-size:14px}
  .ctrlSwitch[hidden]{display:none}
  .ctrlSwitch span{padding:0 8px 0 10px;opacity:.85}
  .ctrlSwitch button{border:0;border-radius:999px;padding:8px 14px;font:600 14px 'Fredoka','Nunito',system-ui,sans-serif;color:#fff;
    background:transparent;cursor:pointer}
  .ctrlSwitch button.on{background:#fff;color:#6a2c7e}
  .dailychip{margin-top:10px;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#5a2470;
    background:linear-gradient(90deg,#ffd34d,#ff9fd0);box-shadow:0 4px 14px rgba(90,40,140,.3)}
  .tapany{margin-top:14px;font-size:13px;font-weight:600;opacity:.7}
  @keyframes pipsad{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
  .stats{display:flex;justify-content:center;gap:22px;margin-top:16px;font-size:14px;opacity:.9}
  .stats b{display:block;font-size:22px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-2deg)}}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes gain{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div class="top">
      <div>
        <div id="alt">0<small>m</small></div>
        <div id="combo">Perfect ×2</div>
      </div>
      <div class="right">
        <div class="chip"><span class="seedDot"></span><span id="seeds">0</span></div>
        <button id="pauseBtn" class="roundBtn" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
        <button id="mute" aria-label="Toggle sound"></button>
      </div>
    </div>
    <div id="banner"><small id="bannerSub" data-t>Now entering</small><span id="bannerText"></span></div>
    <div id="hint">Drag to steer · Tap to bloom a flower</div>
    <div class="bottom" id="bloomBar">
      <div id="charges"></div>
      <div id="meter"><i></i></div>
    </div>
    <!-- phone controls: hold ◀ ▶ to steer, the middle button grows a flower (holds the flower charges) -->
    <div id="pad" hidden>
      <button class="padBtn round" id="padL" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
      <button class="padBtn rect" id="padB" aria-label="Grow a flower"></button>
      <button class="padBtn round" id="padR" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </div>

  <div id="menu" class="overlay">
    <h1 class="title"><span>Sky</span><span style="animation-delay:.25s">bloom</span></h1>
    <div class="sub" data-t>Hop the sky. Grow your own way up.</div>
    <div class="dailychip" id="dailyChip" style="display:none"></div>
    <button class="btn" id="playBtn" data-t>Play</button>
    <div class="howto">
      <div><span class="ic">👆</span><span id="chipSteer"><b>Drag</b> to steer</span></div>
      <div><span class="ic">🌸</span><span id="chipBloom"><b>Tap</b> to bloom a rescue flower</span></div>
      <div><span class="ic">💧</span><span data-t>Land on the <b>dewdrop</b> for Perfects</span></div>
    </div>
    <div class="best" id="menuBest"></div>
  </div>

  <div id="pause" class="overlay hidden">
    <h2 data-t>Paused</h2>
    <button class="btn" id="resumeBtn" data-t>Resume</button>
    <div class="tapany" data-t>or tap anywhere</div>
    <div class="ctrlSwitch" id="ctrlSwitch" hidden><span data-t>Controls</span><button type="button" data-mode="buttons" data-t>Buttons</button><button type="button" data-mode="drag" data-t>Drag</button></div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="pipwrap" aria-hidden="true">
        <svg viewBox="-32 -50 64 82" width="78" height="100">
          <defs><radialGradient id="pipg" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#e6fff5"/><stop offset=".45" stop-color="#7deccb"/><stop offset="1" stop-color="#1f9e8f"/></radialGradient></defs>
          <path d="M0 -20 Q2 -28 0 -34" stroke="#3e9e4a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <ellipse cx="-7" cy="-34" rx="8" ry="4" fill="#7ee36f" transform="rotate(-30 -7 -34)"/>
          <ellipse cx="7" cy="-34" rx="8" ry="4" fill="#9af08a" transform="rotate(30 7 -34)"/>
          <circle r="22" fill="url(#pipg)"/>
          <ellipse cx="-12" cy="5" rx="4" ry="2.5" fill="#ff7896" opacity=".5"/><ellipse cx="12" cy="5" rx="4" ry="2.5" fill="#ff7896" opacity=".5"/>
          <g stroke="#1c3a3f" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M-11 -4 a3.5 3.5 0 1 1 3.5 3.5 a1.8 1.8 0 1 1 -1.8 -1.8"/>
            <path d="M5 -4 a3.5 3.5 0 1 1 3.5 3.5 a1.8 1.8 0 1 1 -1.8 -1.8"/>
            <path d="M-4 11 Q0 7 4 11"/>
          </g>
        </svg>
      </div>
      <h2 data-t>You drifted down at</h2>
      <div class="big"><span id="finalAlt">0</span><small data-t>m</small></div>
      <div class="zone" id="zoneReached"></div>
      <div id="newBest"></div>
      <div class="tobest" id="toBest"><div class="bar"><i></i></div><span></span></div>
      <div class="stats">
        <div><b id="stBest">0</b><span data-t>best</span></div>
        <div><b id="stSeeds">0</b><span data-t>seeds</span></div>
        <div><b id="stCombo">0</b><span data-t>top combo</span></div>
      </div>
    </div>
    <button class="btn" id="againBtn" data-t>Play again</button>
    <div class="tapany" data-t>or tap anywhere</div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- setup ----------
const cvs = document.getElementById('c');
const mainCtx = cvs.getContext('2d');
let ctx = mainCtx;   // draw target; swapped to the lit layer while drawing tinted world objects
// offscreen "lit" layer: platforms & creatures are drawn here, then tinted to match the sky's light
const litCvs = document.createElement('canvas');
const litCtx = litCvs.getContext('2d');
const wrap = document.getElementById('wrap');
const W = 400;              // logical world width
let H = 700, scale = 1, dpr = 1;
let vignette = null;

const TAU = Math.PI * 2;

// ---------- how the game was opened ----------
// ?bot         plays itself (Pixo's attract screen, recording clips): never reads or writes saves
// ?daily=DAY   Pixo's daily challenge: the same sky for everyone that UTC day, plus &twist=<id>
// ?lang=ru     Russian
const Q = new URLSearchParams(location.search);
const BOT = Q.has('bot');
const DAY_OK = /^\d{4}-\d{2}-\d{2}$/;
const TWISTS = {
  bloomful:  { en: 'Full Bloom: start with 3 flowers', ru: 'Полный цвет: 3 цветка на старте' },
  petalless: { en: 'No Petals: no rescue flowers', ru: 'Без лепестков: спасательных цветов нет' },
  gusty:     { en: 'Gusty Skies: updrafts everywhere', ru: 'Ветреное небо: восходящие потоки повсюду' },
  thorny:    { en: 'Thorn Season: brambles from 60 m', ru: 'Сезон колючек: колючки с 60 м' },
  golden:    { en: 'Golden Hour: Rush after 5 Perfects', ru: 'Золотой час: рывок после 5 идеальных' },
  drifting:  { en: 'Drifting Clouds: most platforms move', ru: 'Дрейф облаков: почти все платформы движутся' },
};
const DAILY = !BOT && DAY_OK.test(Q.get('daily') || '') ? { day: Q.get('daily') } : null;
const TWIST = DAILY && TWISTS[Q.get('twist')] ? Q.get('twist') : null;
// FNV-1a (same as Pixo's daily picks) and mulberry32, for the daily challenge's seeded sky
function fnv1a(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
function mulberry32(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const LANG = (Q.get('lang') || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
const RU = {
  'Hop the sky. Grow your own way up.': 'Прыгай по небу. Выращивай свой путь наверх.',
  'Play': 'Играть',
  '<b>Drag</b> to steer': '<b>Веди</b> пальцем, чтобы рулить',
  '<b>Tap</b> to bloom a rescue flower': '<b>Тапни</b> — вырастет спасательный цветок',
  'Land on the <b>dewdrop</b> for Perfects': 'Приземляйся на <b>росинку</b> — будет «Идеально»',
  'Best climb: {n} m': 'Лучший подъём: {n} м',
  "Today's best: {n} m": 'Лучший сегодня: {n} м',
  'Daily challenge': 'Испытание дня',
  'Drag to steer · Tap to bloom a flower': 'Веди — рули · Тапни — цветок',
  'Now entering': 'Новая зона',
  'You drifted down at': 'Полёт окончен на высоте',
  'best': 'рекорд', 'seeds': 'семена', 'top combo': 'лучшая серия',
  'NEW BEST!': 'НОВЫЙ РЕКОРД!',
  'So close! Only {n} m short of your best': 'Почти! До рекорда всего {n} м',
  '{n} m short of your best': 'До рекорда {n} м',
  'Play again': 'Ещё раз', 'or tap anywhere': 'или тапни в любом месте',

function addPlat(type, x, y, w) {
  const p = { type, x, y, w, alive: true, dip: 0, dipV: 0, sq: 0, sqV: 0, vx: 0, ph: rand(0, TAU), t: 0 };
  if (type === 'lantern') p.by = y;
  if (type === 'leaf') {
    const ga = -y / 10;
    p.pal = ga > 900 && ga < 1750 && Math.random() < 0.55 ? 4 + (Math.random() * 2 | 0) : Math.random() * 4 | 0;   // autumn tones at sunset
    p.flip = Math.random() < 0.5 ? 1 : -1;
    p.curl = rand(-2.5, 2.5);
  }
  if (type === 'star') p.cyc = rand(0, STAR_CYCLE);
  plats.push(p);
  return p;
}
// blink-star phase: returns opacity and whether it can be landed on
function starState(p) {
  const c = (time + p.cyc) % STAR_CYCLE;
  if (c < STAR_ON) {
    const warn = c > STAR_ON - 0.55;                        // flickers before vanishing
    const fadeIn = clamp(c / 0.2, 0, 1);
    return { solid: true, a: (warn ? (Math.sin(time * 38) > 0 ? 1 : 0.35) : 1) * Math.max(fadeIn, 0.35) };
  }
  return { solid: false, a: 0.14 };
}
function diff() { return clamp(-genY / 10 / 2600, 0, 1); }
// World layout comes from wrand: Math.random normally, a generator seeded from the date in the
// daily challenge, so every player climbs the very same sky that day. Every roll below happens
// unconditionally and in the same order, so the layout never depends on how a player plays.
function spawnChain() {
  const d = diff(), ga = -genY / 10;
  const gap = wr(lerp(58, 115, d), lerp(100, 190, d));
  const prevY = genY;
  genY -= gap;
  let type = 'leaf';
  const r = wrand();
  const ev = SCRIPT[scriptI] && ga >= SCRIPT[scriptI].at ? SCRIPT[scriptI++].k : null;
  if (ev === 'mush' || r < 0.055 + 0.02 * d) type = 'mush';
  else if (ga > 1600 && r < 0.45) type = 'star';                         // Starfield and above
  else if (ga > 900 && r < (ga < 1700 ? 0.5 : 0.18)) type = 'lantern';  // Sunset Heights
  else if (ga > (TWIST === 'drifting' ? 20 : 60) && r < (TWIST === 'drifting' ? 0.7 : 0.055 + lerp(0.08, 0.42, d))) type = 'cloud';
  const wroll = wr(0.9, 1.1), xroll = wrand();
  const w = type === 'mush' ? 54 : type === 'lantern' ? 58 : lerp(88, 60, d) * wroll;
  const x = lerp(w / 2 + 6, W - w / 2 - 6, xroll);
  const cloudRoll = wrand(), cloudDir = wrand();
  const pl = addPlat(type, x, genY, w);
  if (type === 'cloud') pl.vx = lerp(35, 75, cloudRoll) * lerp(1, 1.9, d) * (cloudDir < 0.5 ? -1 : 1);
  if (ev === 'arc') for (let i = -2; i <= 2; i++) seeds.push({ x: clamp(x + i * 24, 20, W - 20), y: genY - 70 - (4 - i * i) * 11, ph: i, alive: true });
  if (ev === 'draft') { drafts.push({ x: clamp(x + (x < W / 2 ? 110 : -110), 50, W - 50), w: 76, y: genY - 260, h: 380 }); lastDraftY = genY; }
  if (ev === 'vine') { pickups.push({ kind: 'vine', x, y: genY - 46, ph: 0, alive: true }); lastPickY = genY; }
  if (ev === 'bramble') { const bx = x < W / 2 ? W - 70 : 70; brambles.push({ bx, x: bx, y: genY - gap * 0.5, amp: 30, ph: 0, sp: 0.8, alive: true, rot: 0 }); }

  // updraft column
  const gusty = TWIST === 'gusty';
  const dr = wrand(), dh = wr(320, 460), dx = wr(55, W - 55);
  if (ga > (gusty ? 40 : 150) && genY < lastDraftY - (gusty ? 380 : 700) && dr < (gusty ? 0.35 : 0.08)) {
    drafts.push({ x: dx, w: 76, y: genY - dh * 0.55, h: dh });
    lastDraftY = genY;
  }
  // pickups (rare, sat just above the platform so they're easy to grab)
  const pk1 = wrand(), pk2 = wrand();
  if (genY < lastPickY - 1100) {
    let kind = null;
    if (ga > 120 && pk1 < 0.05) kind = 'vine';
    else if (ga > 280 && pk2 < 0.05) kind = 'shield';
    if (kind) { pickups.push({ kind, x, y: genY - 46, ph: 0, alive: true }); lastPickY = genY; }
  }

  // seed column above some platforms
  const sr1 = wrand(), sr2 = wrand(), sx = wr(30, W - 30);
  if (sr1 < 0.32) {
    for (let i = 0; i < 3; i++) seeds.push({ x: x + Math.sin(i * 1.3) * 10, y: genY - 60 - i * 34, ph: i * 2.1, alive: true });
  } else if (sr2 < 0.2) {
    seeds.push({ x: sx, y: lerp(prevY, genY, 0.5), ph: 1.3, alive: true });
  }
  // dandelion puff extra
  const pr = wrand(), poff = wr(-70, 70), py = wr(0.35, 0.65);
  if (ga > 30 && pr < lerp(0.16, 0.32, d)) {
    const pw = 64;
    let px = x + W / 2 + poff; px = ((px % W) + W) % W; px = clamp(px, pw / 2 + 6, W - pw / 2 - 6);
    addPlat('puff', px, lerp(prevY, genY, py), pw);
  }
  // bramble wisp
  const thorny = TWIST === 'thorny';
  const br = wrand(), bx = wr(50, W - 50), bamp = wr(20, 80), bph = wr(0, TAU), bsp = wr(0.8, 1.8);
  if (ga > (thorny ? 60 : 300) && br < (thorny ? Math.min(0.3, 0.14 + ga / 6000) : Math.min(0.16, 0.05 + (ga - 300) / 4000))) {
    brambles.push({ bx, x: bx, y: lerp(prevY, genY, 0.5) - 10, amp: bamp, ph: bph, sp: bsp, alive: true, rot: 0 });
  }
}

// ---------- particles ----------
function burst(x, y, n, o) {
  for (let i = 0; i < n; i++) {
    const a = o.angle != null ? o.angle + rand(-o.spread, o.spread) : rand(0, TAU);
    const s = rand(o.speed[0], o.speed[1]);
    parts.push({
      x: x + rand(-(o.jx || 0), o.jx || 0), y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rand(o.life[0], o.life[1]), max: 0, size: rand(o.size[0], o.size[1]),
      col: Array.isArray(o.col) ? o.col[Math.random() * o.col.length | 0] : o.col,
      kind: o.kind || 'dot', g: o.g || 0, drag: o.drag || 0, rot: rand(0, TAU), vr: rand(-6, 6)
    });
    parts[parts.length - 1].max = parts[parts.length - 1].life;
  }
}
let hitstop = 0;   // brief slow-motion on impacts
function ring(x, y, col, size) { parts.push({ x, y, vx: 0, vy: 0, life: 0.4, max: 0.4, size, col, kind: 'ring', g: 0, drag: 0, rot: 0, vr: 0 }); }
function pop(x, y, text, col, size = 22) {
  x = clamp(x, 80, W - 80);   // keep text on screen
  // nudge upward so popups never land on top of each other
  for (let i = 0; i < 6; i++) {
    if (!pops.some(o => o.max - o.life < 0.7 && Math.abs(o.x - x) < 130 && Math.abs(o.y - y) < (o.size + size) * 0.6)) break;
    y -= size + 6;
  }
  pops.push({ x, y, text, col, size, life: 1.1, max: 1.1 });
}

// ---------- gameplay ----------
function jump(v) {
  P.vy = -v;
  P.sq = 0.32; P.sqV = 0;
  P.sproutV -= 9;
}
function addMeter(n) {
  if (TWIST === 'petalless') return;   // daily twist: no rescue flowers at all
  if (charges >= MAXCH) { meter = NEED; return; }
  meter += n;
  while (meter >= NEED && charges < MAXCH) {
    meter -= NEED; charges++;
    sfx.charge();
    pop(P.x, P.y - 46, T('+1 Bloom'), '#ffb3df', 20);
    gainFx = true;
    if (charges >= MAXCH) meter = NEED;
  }

}
function land(p) {

  if (state !== 'play') { jump(JUMP * 0.9); if (Math.random() < 0.45) P.happyT = 0.6; return; }

  let perfect = false;
  if (p && type !== 'bloom') {
    perfect = rushT > 0 || Math.abs(P.x - p.x) < p.w * PERFECT_FRAC + PERFECT_PAD;
    if (perfect) {
      combo++; bestCombo = Math.max(bestCombo, combo);
      run.perfects++;
      if (rushT <= 0 && combo >= rushNext) startRush();
      P.happyT = 0.5;
      sfx.perfect(combo);
      hitstop = Math.min(0.03 + combo * 0.006, 0.07);
      ring(P.x, p.y, comboCol(), 34 + Math.min(combo, 8) * 4);
      if (type === 'leaf') burst(p.x, p.y - 2, 7, { speed: [60, 150], life: [0.35, 0.6], size: [1.5, 3], col: ['#bfe9ff', '#ffffff'], angle: -Math.PI / 2, spread: 1.1, g: 500 });
      buzz(8);
      pop(P.x, P.y - 34, combo > 1 ? T('Perfect ×{n}', { n: combo }) : T('Perfect!'), combo > 4 ? '#ffd34d' : '#ffffff', combo > 4 ? 24 : 21);
      burst(P.x, P.y + P.r, 10, { speed: [80, 200], life: [0.4, 0.8], size: [6, 12], col: comboCol(), kind: 'spark', angle: -Math.PI / 2, spread: 1.3, g: 200, drag: 2 });
      addMeter(1);
      comboFx = true;
    } else {
      if (combo > 0) comboFx = true;
      if (combo >= 3) pop(P.x, P.y - 30, T('combo lost'), 'rgba(255,255,255,.75)', 15);
      combo = 0; rushNext = RUSH_EVERY;
    }
  } else if (!p) { combo = 0; rushNext = RUSH_EVERY; }
  hudDirty = true;

  const mult = 1 + Math.min(combo, 8) * 0.025;
  switch (type) {
    case 'mush':
      jump(SPRING * mult); p.sq = 0.5; shake = 5; sfx.spring();
      burst(p.x, p.y, 12, { speed: [60, 220], life: [0.4, 0.9], size: [2, 4], col: ['#ff6b81', '#ffffff', '#ffd1dc'], angle: -Math.PI / 2, spread: 1.2, g: 500 });
      break;
    case 'puff':
      jump(JUMP * mult); p.alive = false; sfx.puff();
      burst(p.x, p.y, 16, { speed: [20, 90], life: [1.4, 2.4], size: [5, 8], col: '#ffffff', kind: 'seedling', g: -15, drag: 0.8, jx: p.w * 0.4 });
      break;
    case 'bloom':
      jump(JUMP * mult * 1.12); p.alive = false; sfx.bloomBounce();
      burst(p.x, p.y, 18, { speed: [60, 200], life: [0.9, 1.6], size: [5, 9], col: ['#ff9bd2', '#ffb8e0', '#ff7fc4', '#ffd6ec'], kind: 'petal', g: 160, drag: 1.5, jx: 20 });
      break;
    case 'leaf':
      jump(JUMP * mult); p.dipV += 160; sfx.jump();
      if (Math.random() < 0.5) burst(P.x, p.y, 3, { speed: [30, 90], life: [0.5, 0.9], size: [3, 5], col: ['#8ef07a', '#5cc85a'], kind: 'petal', g: 260, angle: -Math.PI / 2, spread: 1.5, drag: 1 });
      break;
    case 'cloud':
      jump(JUMP * mult); p.dipV += 120; sfx.jump();
      burst(P.x, p.y + 6, 6, { speed: [20, 70], life: [0.4, 0.8], size: [5, 9], col: '#ffffff', angle: Math.PI / 2, spread: 1.4, drag: 2 });
      break;
    case 'lantern':
      jump(JUMP * mult); p.dipV += 140; sfx.lantern();

  }
}

// ---------- saves ----------
// skybloom.best (number): best climb in metres · skybloom.daily: { day, best } for today's challenge

function buzz(pattern) { if (BOT || !navigator.vibrate || !(navigator.userActivation && navigator.userActivation.hasBeenActive)) return; try { navigator.vibrate(pattern); } catch (e) {} }

const run = { perfects: 0, rushes: 0, vines: 0, stomps: 0, shields: 0, blooms: 0 };
function saveStats(final, zone) {

  add('runs', 1); add('seeds', seedsN); add('metres', final);
  for (const k in run) add(k, run[k]);
  s.bestAlt = Math.max(s.bestAlt || 0, final);
  s.bestCombo = Math.max(s.bestCombo || 0, bestCombo);
  s.zone = Math.max(s.zone || 0, zone);
  if (DAILY) add('dailies', 1);
  store('skybloom.stats', JSON.stringify(s));
}

// ---------- Pixo ----------
// Pixo (pixoarcade.com) runs the game in a frame and puts runs on its leaderboards: tell it when a
// run starts and when it ends. Does nothing when the game runs on its own, in ?bot or in #debug.
const HOSTED = window.parent !== window && !BOT && location.hash !== '#debug';
function pixoRun(type, data) {
  if (!HOSTED) return;
  const day = DAILY && type === 'run-start' ? { day: DAILY.day } : {};
  try { window.parent.postMessage({ pixo: type, board: DAILY ? 'daily' : 'score', ...day, ...data }, location.origin); } catch (e) { }
}

// ---------- bot (?bot): aims for the centre of the best reachable platform ----------
const BOT_SPEED = 540;
const wrapDx = d => (d > W / 2 ? d - W : d < -W / 2 ? d + W : d);
function botSteer(dt) {
  const feet = P.y + P.r, g = GRAV;
  const apexFeet = P.vy < 0 ? feet - (P.vy * P.vy) / (2 * g) : feet;
  let target = null, bestScore = -Infinity;
  for (const p of plats) {
    if (!p.alive || p.follow) continue;
    if (p.y < apexFeet + 6 || p.y > camY + H - 20) continue;   // above our apex, or off the bottom
    if (P.vy >= 0 && p.y < feet - 1) continue;                  // falling: only what's still below us
    const drop = p.y - feet, v = P.vy;                          // time until our feet reach that height on the way down
    const t = (v + Math.sqrt(Math.max(0, v * v + 2 * g * drop))) / g;
    const dx = Math.abs(wrapDx(p.x - P.x));
    if (dx > BOT_SPEED * t + p.w * 0.3) continue;
    if (p.type === 'star' && (time + p.cyc + t) % STAR_CYCLE > STAR_ON - 0.1) continue;
    const sc = -p.y + (p.type === 'mush' ? 160 : 0) + (p.type === 'puff' ? -40 : 0) - dx * 0.15;
    if (sc > bestScore) { bestScore = sc; target = p; }
  }
  let aim = target ? target.x : P.x;
  if (!target && P.vy < 0) { // nothing reachable yet: drift toward a pickup or the middle
    const k = pickups.find(k => k.alive && k.y < P.y && k.y > camY);
    aim = k ? k.x : W / 2;
  }
  // sidestep brambles that are close and in the way (unless we're about to stomp one)
  for (const b of brambles) {
    if (!b.alive) continue;
    const by = b.y - P.y, bx = wrapDx(b.x - aim);
    const stomping = P.vy > 0 && by > 0;
    if (!stomping && Math.abs(by) < 140 && Math.abs(bx) < 46) aim = b.x + (bx > 0 ? -60 : 60);
  }
  dragDx += clamp(wrapDx(aim - P.x), -BOT_SPEED * dt, BOT_SPEED * dt);
  if (dangerK > 0.6 && charges > 0 && P.vy > 0) tryBloom();
}

// ---------- update ----------
let seedChain = 0, seedLastT = -9;
let hintT = 0, dangerK = 0, urgeOn = false, bloomTaught = false;
function update(dt) {
  time += dt;
  const playing = state === 'play';

  if (BOT && playing && !P.dead) botSteer(dt);
  // horizontal movement
  if (!P.dead) {
    let dx = 0;
    if (playing) {
      const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
      P.vx = lerp(P.vx, dir * 420, 1 - Math.exp(-12 * dt));
      dx = P.vx * dt + dragDx;
    } else {
      dx = Math.sin(time * 0.9) * 22 * dt; // idle drift in menu
    }
    P.x += dx;
    P.vxv = lerp(P.vxv, dx / dt, 1 - Math.exp(-14 * dt));
    if (P.x < 0) P.x += W; else if (P.x >= W) P.x -= W;
  }
  dragDx = 0;

  // vertical
  const prevFeet = P.y + P.r;
  if (vineT > 0 && !P.dead) {
    // Skyvine: ride straight up while the vine grows beneath Pip
    P.vy = lerp(P.vy, -VINE_SPEED, 1 - Math.exp(-8 * dt));
    vineT -= dt;
    const lp = vinePts[vinePts.length - 1];
    if (!lp || Math.hypot(P.x - lp.x, P.y + P.r - lp.y) > 14) vinePts.push({ x: P.x, y: P.y + P.r });
    if (vineT <= 0) endVine();
  } else {
    P.vy = Math.min(P.vy + GRAV * (Math.abs(P.vy) < APEX_V && !P.dead ? APEX_G : 1) * dt, MAXFALL);
  }
  // updrafts
  let nowDraft = false;
  if (!P.dead && playing) {
    for (const d of drafts) {
      if (Math.abs(P.x - d.x) < d.w / 2 && P.y > d.y && P.y < d.y + d.h) {
        nowDraft = true;
        P.vy = Math.max(P.vy - DRAFT_LIFT * dt, -DRAFT_MAXUP);
        if (Math.random() < dt * 30) burst(P.x + rand(-14, 14), P.y + P.r, 1, { speed: [20, 60], life: [0.4, 0.8], size: [3, 5], col: ['#ffffff', '#d8f7ff'], kind: 'petal', angle: Math.PI / 2, spread: 0.4, drag: 1 });
        break;
      }
    }
  }
  if (nowDraft && !inDraft) { sfx.draft(); intro('draft', T('Updraft!'), '#ffffff'); }
  inDraft = nowDraft;
  P.y += P.vy * dt;
  const feet = P.y + P.r;
  if (!P.dead && P.vy > 0 && (state === 'play' || state === 'menu')) {   // no landings once the run is over
    if (prevFeet <= 0.5 && feet >= 0 && -camY > -40) { P.y = -P.r; land(null); }
    else if (state === 'play') {   // in the menu Pip only bounces on the meadow
      for (const p of plats) {
        if (!p.alive) continue;
        if (p.type === 'star' && !starState(p).solid) continue;
        if (prevFeet <= p.y + 2 && feet >= p.y && Math.abs(P.x - p.x) < p.w / 2 + EDGE_TOL) { P.y = p.y - P.r; land(p); break; }
      }
    }
  }

  // squash & stretch spring
  const tgt = -clamp(Math.abs(P.vy) / 3800, 0, 0.16);
  P.sqV += ((tgt - P.sq) * 420 - P.sqV * 15) * dt;
  P.sq += P.sqV * dt;
  P.sproutV += (-P.sprout * 160 - P.sproutV * 6 - P.vxv * 0.02) * dt;
  P.sprout += P.sproutV * dt;
  if (P.dead) P.rot += dt * 9;
  else P.rot = lerp(P.rot, clamp(P.vxv * 0.0009, -0.35, 0.35), 1 - Math.exp(-10 * dt));
  P.blinkT -= dt;
  if (P.blinkT < 0) { P.blink = 0.14; P.blinkT = rand(2, 5); }
  P.blink = Math.max(0, P.blink - dt);
  P.happyT = Math.max(0, P.happyT - dt);
  P.flowerK = lerp(P.flowerK, rushT > 0 || vineT > 0 ? 1 : 0, 1 - Math.exp(-8 * dt));
  trailT += dt;
  if (trailT >= 1 / 60) {
    trailT = 0;
    trail.push({ x: P.x, y: P.y });
    if (trail.length > 12) trail.shift();
  }

  // trail
  if (!P.dead && vineT > 0 && Math.random() < dt * 25) {
    burst(P.x + rand(-10, 10), P.y + P.r, 1, { speed: [20, 80], life: [0.6, 1], size: [3, 5], col: ['#7ee36f', '#b7f59a'], kind: 'petal', angle: Math.PI / 2, spread: 1, g: 120, drag: 1 });
  }
  if (!P.dead && P.vy < -350 && Math.random() < dt * (combo >= 3 || rushT > 0 ? 26 : 10)) {
    burst(P.x + rand(-6, 6), P.y + P.r * 0.6, 1, { speed: [5, 30], life: [0.35, 0.7], size: [5, 10], col: comboCol(), kind: 'spark', angle: Math.PI / 2, spread: 0.6, drag: 2 });
  }

  // camera
  if (playing) {
    const target = P.y - H * 0.5;   // Pip mid-screen: more sky visible above to plan the route
    if (target < camY) camY = lerp(camY, target, 1 - Math.exp(-10 * dt));
  }

  // platforms
  for (const p of plats) {
    p.t += dt;
    if (p.follow) {
      if (P.vy < 0 && !P.dead) { p.x = clamp(P.x, 42, W - 42); p.y = P.y + P.r + 30; }
      else p.follow = false;
    }
    if (p.type === 'lantern') p.y = p.by + Math.sin(p.t * 1.3 + p.ph) * 26;
    if (p.type === 'cloud') {
      p.x += p.vx * dt;
      if (p.x < p.w / 2 + 4) { p.x = p.w / 2 + 4; p.vx = Math.abs(p.vx); }
      if (p.x > W - p.w / 2 - 4) { p.x = W - p.w / 2 - 4; p.vx = -Math.abs(p.vx); }
    }
    p.dipV += (-p.dip * 260 - p.dipV * 9) * dt; p.dip += p.dipV * dt;
    p.sqV += (-p.sq * 500 - p.sqV * 10) * dt; p.sq += p.sqV * dt;
  }

  // seeds
  for (const s of seeds) {
    if (!s.alive) continue;
    s.ph += dt * 3;
    if (!P.dead && playing) {
      const dx = P.x - s.x, dy = P.y - s.y, d2 = dx * dx + dy * dy;
      if (d2 < 70 * 70) { const d = Math.sqrt(d2) || 1; s.x += dx / d * 260 * dt; s.y += dy / d * 260 * dt; }
      if (d2 < (P.r + 11) * (P.r + 11)) {
        seedChain = time - seedLastT < 0.7 ? seedChain + 1 : 0; seedLastT = time;
        s.alive = false; seedsN++; sfx.seed(seedChain); addMeter(rushT > 0 ? 2 : 1);
        burst(s.x, s.y, 8, { speed: [40, 140], life: [0.3, 0.6], size: [6, 11], col: '255,215,90', kind: 'spark', drag: 3 });
      }
    }
  }

  // brambles
  for (const b of brambles) {
    if (!b.alive) continue;
    b.ph += dt * b.sp; b.rot += dt * 1.5;
    b.x = clamp(b.bx + Math.sin(b.ph) * b.amp, 20, W - 20);
    if (playing && !seen.bramble && Math.abs(P.y - b.y) < 240) intro('bramble', T('Stomp brambles from above!'), '#e3c4ff');
    if (!P.dead && playing) {
      const dx = P.x - b.x, dy = P.y - b.y;
      if (dx * dx + dy * dy < (P.r + 12) * (P.r + 12)) {
        if (vineT > 0 || shield > 0 || GOD) {
          // riding the vine smashes brambles; a petal shield absorbs one hit
          b.alive = false; sfx.stomp(); shake = 5; hitstop = 0.07;
          ring(b.x, b.y, '210,170,255', 50);
          burst(b.x, b.y, 18, { speed: [60, 240], life: [0.4, 0.9], size: [3, 6], col: ['#4a2368', '#8e55b8', '#c9a4ea'], g: 400 });
          if (vineT <= 0 && !GOD) {
            shield = 0; sfx.shieldBreak(); run.shields++; pop(P.x, P.y - 36, T('Shield saved you!'), '#ffc2e6', 17);
            burst(P.x, P.y, 16, { speed: [80, 220], life: [0.6, 1.1], size: [5, 9], col: ['#ff9bd2', '#ffd6ec'], kind: 'petal', g: 200, drag: 1.2 });
            if (P.vy > -500) jump(JUMP * 0.8);
          }
        } else if (P.vy > 0 && P.y < b.y - 2) {
          b.alive = false; jump(JUMP * 1.15); sfx.stomp(); shake = 4; hitstop = 0.08; run.stomps++;
          ring(b.x, b.y, '210,170,255', 50);
          pop(b.x, b.y - 20, T('Stomp!'), '#e3c4ff', 20); addMeter(2);
          burst(b.x, b.y, 18, { speed: [60, 240], life: [0.4, 0.9], size: [3, 6], col: ['#4a2368', '#8e55b8', '#c9a4ea'], g: 400 });
        } else die();
      }
    }
  }

  // pickups
  for (const k of pickups) {
    if (!k.alive) continue;
    k.ph += dt * 2.5;
    if (!P.dead && playing) {
      const dx = P.x - k.x, dy = P.y - k.y;
      if (dx * dx + dy * dy < (P.r + 16) * (P.r + 16)) {
        k.alive = false;
        if (k.kind === 'vine') startVine();
        else { shield = 1; sfx.shield(); pop(P.x, P.y - 40, T('Petal Shield'), '#ffc2e6', 20); ring(P.x, P.y, '255,170,220', 50); }
      }
    }
  }

  // golden rush timer
  if (rushT > 0) {
    rushT -= dt;
    if (Math.random() < dt * 20) burst(P.x + rand(-20, 20), P.y + rand(-20, 20), 1, { speed: [10, 40], life: [0.4, 0.8], size: [6, 10], col: '255,211,77', kind: 'spark', drag: 2 });
    if (rushT <= 0) { rushT = 0; rushNext = combo + RUSH_EVERY; comboFx = true; }
  }

  // particles
  for (const p of parts) {
    p.life -= dt;
    p.vy += p.g * dt;
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    if (p.kind === 'seedling') p.vx += Math.sin(time * 2 + p.rot) * 20 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (const p of pops) { p.life -= dt; p.y -= 45 * dt; }

  // cull + generate
  const lim = camY + H + 100;
  plats = plats.filter(p => p.alive && p.y < lim);
  seeds = seeds.filter(s => s.alive && s.y < lim);
  brambles = brambles.filter(b => b.alive && b.y < lim);
  drafts = drafts.filter(d => d.y < lim);
  pickups = pickups.filter(k => k.alive && k.y < lim);
  if (vinePts.length && vinePts[0].y > lim) vinePts = vinePts.filter(v => v.y < lim + 40);
  parts = parts.filter(p => p.life > 0);
  pops = pops.filter(p => p.life > 0);
  if (playing) fillWorld();

  // altitude & biomes
  if (playing && !P.dead) {
    const alt = Math.max(0, -P.y - P.r) / 10;
    if (alt > maxAlt) { if ((alt | 0) !== (maxAlt | 0)) hudDirty = true; maxAlt = alt; }
    while (biomeIdx + 1 < SKY.length && maxAlt >= SKY[biomeIdx + 1].m) {
      biomeIdx++; showBanner(T(SKY[biomeIdx].name)); sfx.biome(); zoneFlash(biomeIdx);
    }
  }

  // danger: falling into the bottom of the screen -> pulse the bloom button, tint the edge
  // (not while the meadow is still on screen: Pip can't fall past it, so there's no danger yet)
  const meadowOnScreen = -camY < H;
  const low = playing && !P.dead && P.vy > 0 && (P.y - camY) > H * 0.72 && !meadowOnScreen;
  dangerK = lerp(dangerK, low ? 1 : 0, 1 - Math.exp(-10 * dt));
  const urge = low && charges > 0;
  if (urge !== urgeOn) {
    urgeOn = urge; chargesEl.classList.toggle('urge', urge);
    bloomBar.classList.toggle('active', urge || barActiveT > 0);
    if (urge && !bloomTaught) { bloomTaught = true; pop(P.x, P.y - 40, T(padOn ? 'Press the flower button!' : 'Tap to bloom!'), '#ffb3df', 19); }
  }

  // death by falling
  if (playing && P.y - P.r * 0.5 > camY + H) startDying();
  if (state === 'dying') {
    deathT += dt;
    P.vy = Math.min(P.vy, 650);   // drift down gently so the camera can keep Pip in view
    camY = lerp(camY, P.y - H * 0.45, 1 - Math.exp(-6 * dt));
    if (deathT > 0.85) gameOver();
  }

  shake = Math.max(0, shake - dt * 30);
  if (hintT > 0) { hintT -= dt; if (hintT <= 0) hintEl.classList.remove('on'); }
  if (zoneFxT > 0) zoneFxT = Math.max(0, zoneFxT - dt);
  if (barActiveT > 0) { barActiveT -= dt; if (barActiveT <= 0 && !urgeOn) bloomBar.classList.remove('active'); }
}

// ---------- render ----------
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  const off = camY0 - camY;            // how far the camera has climbed (px)
  const m = Math.max(0, off) / 10;     // camera altitude in metres
  curM = m;
  const [top, bot] = skyAt(m);
  // the page around the game (wide screens, Pixo's frame) follows the sky's colours
  if (time - bgSyncT > 0.5 || bgSyncT < 0) { bgSyncT = time; document.body.style.background = `linear-gradient(${rgba(mixc(top, [10, 8, 30], 0.35))}, ${rgba(mixc(bot, [10, 8, 30], 0.35))})`; }

  // sky
  const sg = ctx.createLinearGradient(0, 0, 0, H);
  sg.addColorStop(0, rgba(top)); sg.addColorStop(1, rgba(bot));
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);

  // stars
  const starA = clamp((m - 1050) / 600, 0, 1);
  if (starA > 0) {
    const T = Math.max(1200, H + 60);
    for (const s of stars) {
      let y = (s.y * T + off * 0.04) % T;
      if (y > H) continue;
      const a = starA * (0.55 + 0.45 * Math.sin(time * s.sp + s.tw));
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, TAU); ctx.fill();
      if (s.r > 1.4) glow('200,210,255', s.x, y, 8, a * 0.6);
    }
  }

  // aurora curtains: vertical light streaks hanging from a wavy line
  const aurA = clamp((m - 2150) / 600, 0, 1);
  if (aurA > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 2; i++) {
      const sp = curtains[i], base = H * (0.34 + i * 0.16);
      for (let x = 0; x < W; x += 4) {
        const y = base + Math.sin(x * 0.011 + time * 0.35 + i * 2.4) * 40 + Math.sin(x * 0.027 - time * 0.6 + i) * 14;
        const h = 150 + 60 * Math.sin(x * 0.02 + time * 0.5 + i);
        ctx.globalAlpha = aurA * (0.28 + 0.22 * Math.sin(x * 0.045 + time * 0.9 + i * 3)) * (i ? 0.7 : 1);
        ctx.drawImage(sp, (x + i * 20) % 64, 0, 1, sp.height, x, y - h, 4.5, h);
      }
    }
    ctx.restore();
  }

  // ringed planet & shooting stars in the night zones
  const planetA = clamp((m - 1500) / 400, 0, 1);
  if (planetA > 0) drawPlanet(W * 0.8, H * 0.33 + Math.sin(time * 0.15) * 4, planetA);
  if (m > 1450) drawShootingStars(clamp((m - 1450) / 300, 0, 1));

  // sun / moon
  const night = smooth(clamp((m - 1250) / 450, 0, 1));
  const sunY = H * 0.3 + smooth(clamp((m - 500) / 800, 0, 1)) * H * 0.34 + off * 0.02;
  if (night < 1) {
    const dusk = smooth(clamp((m - 600) / 600, 0, 1));
    const sc = mixc(hex('#fff4c8'), hex('#ff8a5c'), dusk);
    const scs = `${sc[0]},${sc[1]},${sc[2]}`, sx = W * 0.76, sr = 30 + dusk * 12, sa = 1 - night;
    // soft rotating rays
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(sx, sunY); ctx.rotate(time * 0.05);
    const rg = ctx.createRadialGradient(0, 0, sr, 0, 0, sr * 5);
    rg.addColorStop(0, `rgba(${scs},${(0.08 + 0.09 * dusk) * sa})`); rg.addColorStop(1, `rgba(${scs},0)`);
    ctx.fillStyle = rg;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU, wdt = 0.09 + (i % 2) * 0.05;
      ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a - wdt) * sr * 5, Math.sin(a - wdt) * sr * 5); ctx.lineTo(Math.cos(a + wdt) * sr * 5, Math.sin(a + wdt) * sr * 5);
    }
    ctx.fill(); ctx.restore();
    glow(scs, sx, sunY, 170 + dusk * 60, 0.5 * sa);
    if (dusk > 0.05) {   // horizontal haze band at sunset
      ctx.save(); ctx.globalAlpha = 0.35 * dusk * sa; ctx.translate(sx, sunY); ctx.scale(3.2, 0.5);
      ctx.drawImage(glowSprite(scs), -90, -90, 180, 180); ctx.restore();
    }
    const sg2 = ctx.createRadialGradient(sx - sr * 0.3, sunY - sr * 0.3, sr * 0.1, sx, sunY, sr);
    sg2.addColorStop(0, `rgba(255,255,240,${sa})`); sg2.addColorStop(1, rgba(sc, sa));
    ctx.fillStyle = sg2;
    ctx.beginPath(); ctx.arc(sx, sunY, sr, 0, TAU); ctx.fill();
  }
  if (night > 0) {
    const my = H * 0.16 + Math.sin(time * 0.1) * 3;
    glow('190,200,255', W * 0.24, my, 110, 0.45 * night);
    ctx.fillStyle = `rgba(246,243,255,${night})`;
    ctx.beginPath(); ctx.arc(W * 0.24, my, 24, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgba(190,185,230,${0.5 * night})`;
    ctx.beginPath(); ctx.arc(W * 0.24 - 7, my - 5, 5, 0, TAU); ctx.arc(W * 0.24 + 8, my + 6, 3.5, 0, TAU); ctx.arc(W * 0.24 + 4, my - 9, 2.5, 0, TAU); ctx.fill();
  }

  // floating islands far away in the Cloud Sea
  const islA = clamp((m - 200) / 250, 0, 1) * clamp((1350 - m) / 350, 0, 1);
  if (islA > 0) {
    const T3 = Math.max(2000, H + 400);
    const icol = mixc(bot, hex('#7f8fc9'), 0.35), gcol = mixc(bot, hex('#8fcf9a'), 0.45);
    for (const is of islands) {
      const y = ((is.y * T3 + off * 0.16) % T3) - 150;
      if (y < -150 || y > H + 50) continue;
      drawIsland(is.x * W + Math.sin(time * 0.2 + is.x * 9) * 6, y, is.sc, icol, gcol, islA * 0.75);
    }
  }
  // distant sky-lanterns drifting up at sunset
  const flA = clamp((m - 850) / 250, 0, 1) * clamp((1950 - m) / 350, 0, 1);
  if (flA > 0) {
    for (const l of farLanterns) {
      const span = H * 1.2;
      const y = H + 40 - ((time * l.sp + l.y0 * span) % span);
      const x = l.x + Math.sin(time * 0.5 + l.ph) * 8;
      const fl = 0.75 + 0.25 * Math.sin(time * 6 + l.ph);
      glow('255,170,90', x, y, l.r * 6, flA * 0.55 * fl);
      ctx.fillStyle = `rgba(255,214,150,${flA * 0.9})`; ctx.beginPath(); ctx.arc(x, y, l.r, 0, TAU); ctx.fill();
    }
  }

  // far hills
  hills(H * 0.84 + off * 0.18, 70, 0.011, 1.3, rgba(mixc(bot, hex('#8fb8e8'), 0.45)));
  hills(H * 0.88 + off * 0.35, 55, 0.017, 4.1, rgba(mixc(bot, hex('#77c39a'), 0.55)));

  // back clouds
  const cloudA = 1 - smooth(clamp((m - 1100) / 600, 0, 1)) * 0.94;
  const T2 = Math.max(1400, H + 300);
  for (const c of bgClouds) {
    const sp = cloudSprite(c.s, m);
    const w = sp.width * c.sc, h = sp.height * c.sc;
    let y = ((c.y * T2 + off * 0.3) % T2) - 140;
    if (y > H || y + h < 0) continue;
    const x = ((c.x * (W + w) + time * c.v) % (W + w)) - w;
    ctx.globalAlpha = c.a * cloudA * (m < 1200 ? 1 : 0.8);
    ctx.drawImage(sp, x, y, w, h);
  }
  ctx.globalAlpha = 1;

  // bird flocks crossing the morning sky
  const birdA = 1 - smooth(clamp((m - 650) / 350, 0, 1));
  drawFlocks(birdA, mixc(top, hex('#2a3560'), 0.55));

  // ---- world layer ----
  const shX = shake > 0 ? rand(-shake, shake) : 0, shY = shake > 0 ? rand(-shake, shake) : 0;
  ctx.save(); ctx.translate(shX, shY - camY);
  for (const d of drafts) drawDraft(d, m);
  ctx.restore();

  // lit pass: non-glowing world objects get tinted by the zone's light (warm at sunset, moonlit at night)
  const light = lightAt(m);
  nightK = smooth(clamp((m - 1300) / 500, 0, 1));
  const lit = light[3] > 0.01;
  if (lit) {
    litCtx.setTransform(1, 0, 0, 1, 0, 0);
    litCtx.clearRect(0, 0, litCvs.width, litCvs.height);
    ctx = litCtx;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  ctx.save(); ctx.translate(shX, shY - camY);
  drawMeadow();
  drawVine();
  for (const p of plats) {
    const sy = p.y - camY;
    if (sy < -60 || sy > H + 60) continue;
    if (p.type === 'leaf') drawLeaf(p);
    else if (p.type === 'cloud') drawCloudPlat(p);
    else if (p.type === 'puff') drawPuff(p);
    else if (p.type === 'mush') drawMush(p);
    else if (p.type === 'bloom') drawBloom(p);
  }
  for (const b of brambles) drawBramble(b);
  ctx.restore();
  if (lit) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = rgba(light, light[3]);
    ctx.fillRect(0, 0, litCvs.width, litCvs.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx = mainCtx;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(litCvs, 0, 0); ctx.restore();
  }

  // emissive pass: things that glow on their own stay bright
  ctx.save(); ctx.translate(shX, shY - camY);
  for (const p of plats) {
    const sy = p.y - camY;
    if (sy < -60 || sy > H + 60) continue;
    if (p.type === 'lantern') drawLantern(p);
    else if (p.type === 'star') drawStarPlat(p);
  }
  for (const s of seeds) drawSeed(s);
  for (const k of pickups) drawPickup(k);

  // particles
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'spark') { glow(p.col, p.x, p.y, p.size * (0.5 + a * 0.7), a * 0.9); continue; }
    if (p.kind === 'ring') {
      const k = 1 - a, e = 1 - (1 - k) * (1 - k);
      ctx.strokeStyle = `rgba(${p.col},${a * 0.9})`; ctx.lineWidth = 1 + 3.5 * a;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 6 + p.size * e, (6 + p.size * e) * 0.32, 0, 0, TAU); ctx.stroke();
      continue;
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.col;
    if (p.kind === 'petal') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, TAU); ctx.fill(); ctx.restore();
    } else if (p.kind === 'seedling') {
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.8})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + p.size * 1.6); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x, p.y + p.size * 1.6, 1.4, 0, TAU); ctx.fillStyle = `rgba(160,130,90,${a})`; ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // player (draw wrapped copies near edges)
  drawTrail();
  drawPlayer(P.x, P.y);
  if (P.x < P.r + 6) drawPlayer(P.x + W, P.y);
  if (P.x > W - P.r - 6) drawPlayer(P.x - W, P.y);
  if (shield > 0 && !P.dead) drawShield(P.x, P.y);
  drawComboBadge();
  drawWrapGlow();

  // popups
  for (const p of pops) {
    const a = clamp(p.life / p.max * 1.6, 0, 1);
    const s = p.size * (1 + Math.max(0, (p.life - p.max + 0.15)) * 3);
    ctx.font = `700 ${s}px Fredoka, Nunito, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(60,20,100,.35)';
    ctx.fillText(p.text, p.x, p.y + 2);
    ctx.fillStyle = p.col;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (vignette) ctx.drawImage(vignette, 0, 0, W, H);
  if (dangerK > 0.01) {
    const dg = ctx.createLinearGradient(0, H * 0.7, 0, H);
    dg.addColorStop(0, 'rgba(255,90,150,0)');
    dg.addColorStop(1, `rgba(255,90,150,${0.32 * dangerK * (0.75 + 0.25 * Math.sin(time * 14))})`);
    ctx.fillStyle = dg; ctx.fillRect(0, H * 0.7, W, H * 0.3);
  }
  if (zoneFxT > 0) {
    const k = zoneFxT / 1.4, a = Math.sin(k * Math.PI) * 0.28;
    const zg = ctx.createLinearGradient(0, 0, 0, H);
    zg.addColorStop(0, `rgba(${zoneFxCol},${a})`); zg.addColorStop(0.6, `rgba(${zoneFxCol},${a * 0.25})`); zg.addColorStop(1, `rgba(${zoneFxCol},0)`);
    ctx.fillStyle = zg; ctx.fillRect(0, 0, W, H);
  }
  if (state === 'dying' || state === 'over') {
    const k = state === 'over' ? 1 : clamp(deathT / 0.85, 0, 1);
    ctx.fillStyle = `rgba(15,8,40,${0.32 * k})`; ctx.fillRect(0, 0, W, H);
  }
  if (rushT > 0) {
    // golden frame; flickers during the last second as a warning
    const k = Math.min(1, rushT * 2) * (rushT < 1.2 ? (Math.sin(time * 30) > 0 ? 1 : 0.4) : 1);
    const rg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.72);
    rg.addColorStop(0, 'rgba(255,200,60,0)'); rg.addColorStop(1, `rgba(255,200,60,${0.38 * k})`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
}

function drawDraft(d, m) {
  const sy = d.y - camY;
  if (sy > H + 20 || sy + d.h < -20) return;
  const col = m > 1400 ? '150,255,220' : '255,255,255';
  const gr = ctx.createLinearGradient(0, d.y, 0, d.y + d.h);
  gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(0.25, `rgba(${col},.17)`);
  gr.addColorStop(0.8, `rgba(${col},.2)`); gr.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = gr;
  ctx.beginPath();
  for (let y = 0; y <= d.h; y += 20) {
    const x = d.x - d.w / 2 + Math.sin((d.y + y) * 0.03 + time * 2) * 5;
    if (y === 0) ctx.moveTo(x, d.y + y); else ctx.lineTo(x, d.y + y);
  }
  for (let y = d.h; y >= 0; y -= 20) ctx.lineTo(d.x + d.w / 2 + Math.sin((d.y + y) * 0.03 + time * 2 + 1) * 5, d.y + y);
  ctx.closePath(); ctx.fill();
  // rising wind streaks
  ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (let i = 0; i < 8; i++) {
    const k = (time * 0.85 + i * 0.37) % 1;
    const yy = d.y + d.h * (1 - k);
    const xx = d.x - d.w * 0.36 + (i / 7) * d.w * 0.72 + Math.sin(time * 3 + i) * 4;
    ctx.globalAlpha = Math.sin(k * Math.PI) * 0.7;
    ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, yy + 16 + (i % 3) * 7); ctx.stroke();
  }
  // chevrons at the base hint "this pushes up"
  ctx.globalAlpha = 0.5 + 0.3 * Math.sin(time * 4);
  ctx.lineWidth = 3;
  for (let i = 0; i < 2; i++) {
    const cy = d.y + d.h - 30 - i * 14 - ((time * 20) % 14);
    ctx.beginPath(); ctx.moveTo(d.x - 10, cy + 6); ctx.lineTo(d.x, cy); ctx.lineTo(d.x + 10, cy + 6); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawVine() {
  const n = vinePts.length;
  if (n < 2) return;
  const wig = i => Math.sin(i * 0.5) * 7 * Math.min(1, (n - 1 - i) / 6);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [lw, col] of [[8, '#2f7d3e'], [4, '#6fd36a']]) {
    ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i < n; i++) { const v = vinePts[i]; if (i === 0) ctx.moveTo(v.x + wig(i), v.y); else ctx.lineTo(v.x + wig(i), v.y); }
    ctx.stroke();
  }
  // leaves unfurl along the stalk
  for (let i = 2; i < n - 1; i += 3) {
    const v = vinePts[i], side = (i / 3) % 2 < 1 ? 1 : -1;
    const g = Math.min(1, (n - 1 - i) / 4);
    ctx.save(); ctx.translate(v.x + wig(i), v.y); ctx.rotate(side * 0.7 + Math.sin(time * 2 + i) * 0.1);
    ctx.fillStyle = side > 0 ? '#7ee36f' : '#5cc85a';
    ctx.beginPath(); ctx.ellipse(side * 9 * g, 0, 9 * g, 4 * g, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawLantern(p) {
  const x = p.x, y = p.y + p.dip;
  glow('255,170,80', x, y + 20, 64, 0.5 + 0.12 * Math.sin(time * 5 + p.ph));
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(time * 1.6 + p.ph) * 0.05);
  const bw = p.w * 0.46;
  const gr = ctx.createRadialGradient(0, 18, 2, 0, 18, bw * 1.2);
  gr.addColorStop(0, '#fff3c4'); gr.addColorStop(0.45, '#ffb44d'); gr.addColorStop(1, '#e0533a');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(0, 20, bw, 16, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(150,50,30,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(0, 20, bw * 0.5, 16, 0, 0, TAU); ctx.moveTo(0, 4); ctx.lineTo(0, 36); ctx.stroke();
  ctx.fillStyle = '#7a3b2a';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-p.w / 2, -2, p.w, 7, 3.5) : ctx.rect(-p.w / 2, -2, p.w, 7); ctx.fill();
  ctx.fillRect(-8, 35, 16, 4);
  ctx.strokeStyle = '#e0533a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 39); ctx.quadraticCurveTo(Math.sin(time * 2 + p.ph) * 4, 46, Math.sin(time * 2 + p.ph) * 3, 54); ctx.stroke();
  ctx.restore();
  drawDew(x, y - 2, p.ph);
}

function starShape(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i / 10 * TAU - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}
function drawStarPlat(p) {
  const st = starState(p), y = p.y + 3 + p.dip;
  glow('200,220,255', p.x, y, p.w * 0.85, 0.5 * st.a);
  ctx.globalAlpha = st.a;
  ctx.strokeStyle = 'rgba(225,235,255,.95)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  if (!st.solid) ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.moveTo(p.x - p.w / 2 + 6, y); ctx.quadraticCurveTo(p.x, y + 5, p.x + p.w / 2 - 6, y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#fffbe6';
  starShape(p.x - p.w / 2 + 6, y, 6, time * 0.6 + p.ph);
  starShape(p.x + p.w / 2 - 6, y, 6, -time * 0.6 + p.ph);
  starShape(p.x, y + 2.5, 8.5, time * 0.3);
  ctx.globalAlpha = 1;
}

function drawPickup(k) {
  if (!k.alive) return;
  const y = k.y + Math.sin(k.ph) * 5;
  if (k.kind === 'vine') {
    glow('140,255,120', k.x, y, 40, 0.7);
    const gr = ctx.createRadialGradient(k.x - 3, y - 4, 1, k.x, y, 13);
    gr.addColorStop(0, '#e9ffd9'); gr.addColorStop(0.5, '#7ee36f'); gr.addColorStop(1, '#2f8f45');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(k.x, y, 10, 13, 0, 0, TAU); ctx.fill();
    // curling sprout on top
    ctx.strokeStyle = '#3f9a4c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(k.x, y - 12); ctx.bezierCurveTo(k.x + 2, y - 20, k.x + 10, y - 20, k.x + 8, y - 14); ctx.stroke();
    ctx.fillStyle = '#9af08a';
    ctx.beginPath(); ctx.ellipse(k.x - 5, y - 17, 5, 2.5, -0.6 + Math.sin(k.ph * 2) * 0.2, 0, TAU); ctx.fill();
    // up arrow
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.moveTo(k.x, y - 5); ctx.lineTo(k.x - 4.5, y + 1); ctx.lineTo(k.x + 4.5, y + 1); ctx.fill();
    ctx.fillRect(k.x - 1.5, y, 3, 6);
  } else {
    glow('255,160,215', k.x, y, 40, 0.7);
    ctx.save(); ctx.translate(k.x, y); ctx.rotate(k.ph * 0.6);
    for (let i = 0; i < 5; i++) {
      ctx.rotate(TAU / 5);
      ctx.fillStyle = i % 2 ? '#ffb8e0' : '#ff8fca';
      ctx.beginPath(); ctx.ellipse(0, -7, 5, 8, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#fff3fa'; ctx.beginPath(); ctx.arc(k.x, y, 4.5, 0, TAU); ctx.fill();
  }
}

function drawShield(x, y) {
  ctx.strokeStyle = `rgba(255,190,230,${0.35 + 0.15 * Math.sin(time * 4)})`; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, P.r + 10, 0, TAU); ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const a = time * 2.2 + i / 5 * TAU;
    const px = x + Math.cos(a) * (P.r + 10), py = y + Math.sin(a) * (P.r + 10) * 0.9;
    ctx.save(); ctx.translate(px, py); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = i % 2 ? '#ffb8e0' : '#ff8fca';
    ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawIsland(x, y, sc, rock, grass, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = rgba(rock);
  ctx.beginPath(); ctx.moveTo(-60, 0);
  ctx.quadraticCurveTo(-40, 30, -18, 60); ctx.lineTo(-6, 95); ctx.lineTo(4, 70); ctx.lineTo(14, 88);
  ctx.quadraticCurveTo(40, 30, 60, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgba(grass);
  ctx.beginPath(); ctx.ellipse(0, 0, 62, 9, 0, 0, TAU); ctx.fill();
  // little tree & a waterfall wisp
  ctx.fillStyle = rgba(rock); ctx.fillRect(20, -22, 3, 20);
  ctx.fillStyle = rgba(grass); ctx.beginPath(); ctx.arc(21.5, -26, 11, 0, TAU); ctx.arc(14, -20, 7, 0, TAU); ctx.fill();
  const wf = ctx.createLinearGradient(0, 4, 0, 90);
  wf.addColorStop(0, 'rgba(255,255,255,.55)'); wf.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = wf; ctx.fillRect(-36, 4, 5, 70 + Math.sin(time * 3) * 3);
  ctx.restore();
}
function drawFlocks(a, col) {
  if (a > 0.2 && time > nextFlock && flocks.length < 2) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    flocks.push({ t0: time, dir, x0: dir > 0 ? -60 : W + 60, y: rand(0.08, 0.45) * H, n: 3 + (Math.random() * 4 | 0), sp: rand(28, 48), sc: rand(0.7, 1.1) });
    nextFlock = time + rand(5, 11);
  }
  flocks = flocks.filter(f => { const x = f.x0 + f.dir * f.sp * (time - f.t0); return x > -120 && x < W + 120; });
  if (a <= 0.01) return;
  ctx.strokeStyle = rgba(col, 0.55 * a); ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const f of flocks) {
    const fx = f.x0 + f.dir * f.sp * (time - f.t0);
    for (let i = 0; i < f.n; i++) {
      const row = Math.ceil(i / 2), side = i % 2 ? 1 : -1;
      const bx = fx - f.dir * row * 14 * f.sc, by = f.y + row * side * 9 * f.sc + Math.sin(time * 1.3 + i) * 2;
      const flap = Math.sin(time * 9 + i * 1.7) * 4 * f.sc, ws = 6 * f.sc;
      ctx.beginPath(); ctx.moveTo(bx - ws, by - flap); ctx.quadraticCurveTo(bx - ws * 0.4, by - flap * 0.2 - 1, bx, by);
      ctx.quadraticCurveTo(bx + ws * 0.4, by - flap * 0.2 - 1, bx + ws, by - flap); ctx.stroke();
    }
  }
}
function drawPlanet(x, y, a) {
  ctx.save(); ctx.globalAlpha = a;
  glow('200,150,255', x, y, 80, 0.35);
  const ring = (front) => {
    ctx.strokeStyle = 'rgba(255,215,240,.7)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(x, y, 34, 9, -0.35, front ? 0 : Math.PI, front ? Math.PI : TAU); ctx.stroke();
  };
  ring(false);
  const g = ctx.createRadialGradient(x - 7, y - 8, 2, x, y, 20);
  g.addColorStop(0, '#ffd6f2'); g.addColorStop(0.5, '#b58cf0'); g.addColorStop(1, '#5a3fa8');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 19, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y + 4, 17, 3, -0.2, 0, TAU); ctx.stroke();
  ring(true);
  ctx.restore();
}
function drawShootingStars(a) {
  if (time > nextShoot) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    shoots.push({ t0: time, x: rand(0.2, 0.8) * W, y: rand(0.05, 0.4) * H, vx: dir * rand(260, 380), vy: rand(120, 200) });
    nextShoot = time + rand(2.5, 6);
  }
  shoots = shoots.filter(sh => time - sh.t0 < 0.9);
  for (const sh of shoots) {
    const k = (time - sh.t0) / 0.9, hx = sh.x + sh.vx * (time - sh.t0), hy = sh.y + sh.vy * (time - sh.t0);
    const al = a * Math.sin(k * Math.PI);
    const g = ctx.createLinearGradient(hx, hy, hx - sh.vx * 0.25, hy - sh.vy * 0.25);
    g.addColorStop(0, `rgba(255,255,255,${al})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - sh.vx * 0.25, hy - sh.vy * 0.25); ctx.stroke();
    glow('220,230,255', hx, hy, 10, al);
  }
}
function hills(yb, amp, freq, ph, col) {
  if (yb - amp * 1.4 > H) return;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, Math.max(H, yb) + 10);
  for (let x = 0; x <= W + 10; x += 10) {
    ctx.lineTo(x, yb - amp * (0.5 + 0.5 * Math.sin(x * freq + ph)) - amp * 0.3 * Math.sin(x * freq * 2.3 + ph * 1.7));
  }
  ctx.lineTo(W, Math.max(H, yb) + 10); ctx.closePath(); ctx.fill();
}

function drawMeadow() {
  const gy = 0; // world y of ground surface
  if (gy - camY > H + 40) return;
  const bottom = Math.max(gy + 40, camY + H + 20);
  const gr = ctx.createLinearGradient(0, gy - 10, 0, gy + 160);
  gr.addColorStop(0, '#8fe27a'); gr.addColorStop(0.3, '#5cbf5f'); gr.addColorStop(1, '#2f8a55');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.moveTo(0, bottom);
  for (let x = 0; x <= W + 6; x += 6) ctx.lineTo(x, gy + 4 - Math.abs(Math.sin(x * 0.5 + Math.sin(time * 1.5 + x * 0.02) * 0.6)) * 7);
  ctx.lineTo(W, bottom); ctx.closePath(); ctx.fill();
  // grass blades swaying in the breeze (back rows darker)
  for (const b of grassBlades) {
    const by = gy + 6 + b.d, sway = Math.sin(time * 1.8 + b.ph + b.x * 0.02) * 3;
    ctx.fillStyle = b.d > 14 ? b.c : '#3f9a4c';
    ctx.beginPath(); ctx.moveTo(b.x - 2, by);
    ctx.quadraticCurveTo(b.x + sway * 0.4, by - b.h * 0.55, b.x + sway, by - b.h);
    ctx.quadraticCurveTo(b.x + 0.5 + sway * 0.4, by - b.h * 0.45, b.x + 2, by); ctx.fill();
  }
  // butterflies
  for (const f of butterflies) {
    const bx = f.bx + Math.sin(time * f.sp + f.ph) * 70, by = gy - 28 - Math.abs(Math.sin(time * 1.3 * f.sp + f.ph)) * 46;
    const flap = Math.abs(Math.sin(time * 13 + f.ph));
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.ellipse(bx - 3.5 * flap, by, 4 * flap + 0.5, 3, -0.4, 0, TAU); ctx.ellipse(bx + 3.5 * flap, by, 4 * flap + 0.5, 3, 0.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a3a4a'; ctx.fillRect(bx - 0.6, by - 2.5, 1.2, 5);
  }
  // flowers
  for (const f of meadowFlowers) {
    const sway = Math.sin(time * 1.6 + f.ph) * 3;
    const by = gy + f.d;
    ctx.strokeStyle = '#3f9a4c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(f.x, by); ctx.quadraticCurveTo(f.x, by - f.h * 0.6, f.x + sway, by - f.h); ctx.stroke();
    ctx.fillStyle = f.c;

    ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(f.x + sway, by - f.h, 1.8, 0, TAU); ctx.fill();
  }
}

const LEAF_PAL = [
  ['#a6f58c', '#62cc5e', '#2f8f45'], ['#d4f58a', '#9ccf4f', '#5f9a2c'], ['#a4f2cb', '#4fc59a', '#22876a'],
  ['#c8f5a0', '#7fd46a', '#3f9a4c'], ['#ffd88f', '#f5a04f', '#c4562c'], ['#ffc1a0', '#ec7a5a', '#a8413a'],
];
function drawLeaf(p) {
  const w = p.w, y = p.y + p.dip + Math.sin(time * 1.4 + p.ph) * 1.2;
  const pal = LEAF_PAL[p.pal || 0], c = p.curl || 0;
  ctx.save(); ctx.translate(p.x, 0); ctx.scale(p.flip || 1, 1); ctx.translate(-p.x, 0);   // mirror for variety

  ctx.beginPath(); ctx.ellipse(p.x, y + 13, w * 0.42, 4, 0, 0, TAU); ctx.fill();

  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.moveTo(x0, y + 3);
  ctx.bezierCurveTo(x0 + w * 0.25, y - 6 + c, x1 - w * 0.25, y - 6 - c, x1, y + 2 - c * 0.6);

  ctx.beginPath(); ctx.moveTo(x0 + 5, y + 3); ctx.quadraticCurveTo(p.x, y + 2, x1 - 5, y + 2.5); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.28)';

// dewdrop marks the Perfect spot in the centre of a platform
function drawDew(x, y, ph) {

function drawCloudPlat(p) {
  const w = p.w, y = p.y + p.dip, n = 4;

// dandelion puff: three soft, round seed-heads on a little stalk; one bounce and they burst
function drawPuff(p) {
  const w = p.w, y = p.y + Math.sin(time * 2.2 + p.ph) * 2;
  glow('255,255,255', p.x, y + 8, w * 0.75, 0.4);
  // stalk
  ctx.strokeStyle = '#8fbf6a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(p.x, y + 16); ctx.quadraticCurveTo(p.x + 2, y + 24, p.x - 1, y + 30); ctx.stroke();
  const heads = [[-w * 0.29, 10, 10.5], [w * 0.29, 10, 10.5], [0, 7, 13]];
  for (const [ox, oy, r] of heads) {
    const cx = p.x + ox, cy = y + oy + Math.sin(time * 2.6 + p.ph + ox) * 1.2;
    // fine radiating filaments make it read as fluff, not spikes
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let k = 0; k < 14; k++) {

      ctx.moveTo(cx + Math.cos(a) * r * 0.5, cy + Math.sin(a) * r * 0.5);
      ctx.lineTo(cx + Math.cos(a) * (r + 2.5), cy + Math.sin(a) * (r + 2.5));
    }
    ctx.stroke();
    const gr = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.1, cx, cy, r);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.7, 'rgba(250,250,255,.92)'); gr.addColorStop(1, 'rgba(225,230,250,.55)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(200,180,140,.7)'; ctx.beginPath(); ctx.arc(cx, cy + r * 0.15, 1.6, 0, TAU); ctx.fill();
  }
}

function drawMush(p) {
  const w = p.w, y = p.y, s = p.sq;

  ctx.fillStyle = '#fff2dc';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(p.x - 7, y + 2, 14, 24 - s * 10, 6) : ctx.rect(p.x - 7, y + 2, 14, 24); ctx.fill();

  ctx.fillStyle = gr;

  ctx.fillStyle = '#ffe0c8';

  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath();
  ctx.arc(p.x - cw * 0.45, y - ch * 0.15, 3.5, 0, TAU);
  ctx.arc(p.x + cw * 0.1, y - ch * 0.55, 4.5, 0, TAU);

}

function drawBloom(p) {
  const g = easeOutBack(clamp(p.t / 0.35, 0, 1));
  const y = p.y + 4 + p.dip;
  glow('255,150,210', p.x, y, 70 * g, 0.5);
  const n = 8, rx = p.w * 0.36 * g, ry = 8 * g;
  const petal = (i, front) => {
    const a = i / n * TAU + time * 0.3;
    const s = Math.sin(a);
    if ((s > 0) !== front) return;
    const px = p.x + Math.cos(a) * rx, py = y + s * ry;
    ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(s * ry, Math.cos(a) * rx));
    const gr = ctx.createLinearGradient(-14, 0, 14, 0);
    gr.addColorStop(0, '#ff7fc4'); gr.addColorStop(1, '#ffd6ec');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.ellipse(0, 0, 15 * g, (7 + s * 1.5) * g, 0, 0, TAU); ctx.fill();
    ctx.restore();
  };
  for (let i = 0; i < n; i++) petal(i, false);
  const cg = ctx.createRadialGradient(p.x - 3, y - 3, 1, p.x, y, 11 * g);
  cg.addColorStop(0, '#fff7c2'); cg.addColorStop(1, '#ffbf2e');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.ellipse(p.x, y, 11 * g, 7 * g, 0, 0, TAU); ctx.fill();
  for (let i = 0; i < n; i++) petal(i, true);
}

function drawSeed(s) {
  if (!s.alive) return;
  const y = s.y + Math.sin(s.ph) * 4;
  glow('255,215,90', s.x, y, 24, 0.65);
  const gr = ctx.createRadialGradient(s.x - 2, y - 2, 0.5, s.x, y, 6.5);
  gr.addColorStop(0, '#fffbe0'); gr.addColorStop(0.6, '#ffd34d'); gr.addColorStop(1, '#e8930f');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s.x, y, 6, 0, TAU); ctx.fill();
  // sparkle
  const k = 0.5 + 0.5 * Math.sin(s.ph * 1.7);
  ctx.strokeStyle = `rgba(255,255,255,${0.5 + k * 0.5})`; ctx.lineWidth = 1.2;
  const L = 4 + k * 5;
  ctx.beginPath(); ctx.moveTo(s.x + 4 - L, y - 4); ctx.lineTo(s.x + 4 + L, y - 4); ctx.moveTo(s.x + 4, y - 4 - L); ctx.lineTo(s.x + 4, y - 4 + L); ctx.stroke();
}

function drawBramble(b) {
  if (!b.alive) return;
  const y = b.y + Math.sin(b.ph * 2) * 4;
  glow('170,90,230', b.x, y, 40, 0.45);
  ctx.save(); ctx.translate(b.x, y); ctx.rotate(b.rot);

  ctx.beginPath();
  const n = 9;

    const a = i / (n * 2) * TAU, r = i % 2 ? 10 : 18;
    if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }

  // grumpy eyes
  const look = clamp((P.x - b.x) / 80, -1, 1) * 1.5;
