  ctx.beginPath(); ctx.ellipse(b.x - 4 + look, y - 1, 2.6, 2.2, 0, 0, TAU); ctx.ellipse(b.x + 4 + look, y - 1, 2.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#2a0f3d'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(b.x - 7, y - 5); ctx.lineTo(b.x - 2, y - 3); ctx.moveTo(b.x + 7, y - 5); ctx.lineTo(b.x + 2, y - 3); ctx.stroke();
}

// ribbon trail: one smooth tapered shape, fading out towards the tail
// small "×N" badge that rides beside Pip while a combo is going
let badgeCombo = 0, badgePopT = 0;
function drawComboBadge() {
  if (combo !== badgeCombo) { if (combo > badgeCombo) badgePopT = 0.25; badgeCombo = combo; }
  badgePopT = Math.max(0, badgePopT - 1 / 60);
  if (combo < 2 || P.dead || state !== 'play') return;
  const s = 1 + badgePopT * 1.6, x = clamp(P.x + P.r + 14, 22, W - 22), y = P.y - P.r - 6;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const txt = '×' + combo;
  ctx.font = '700 15px Fredoka, Nunito, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 12;
  ctx.fillStyle = `rgba(${comboCol()},.92)`;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-w / 2, -10, w, 20, 10) : ctx.rect(-w / 2, -10, w, 20); ctx.fill();
  ctx.fillStyle = '#4a2266'; ctx.fillText(txt, 0, 1);
  ctx.restore(); ctx.textBaseline = 'alphabetic';
}
// soft glows on both screen edges when Pip is about to wrap around
function drawWrapGlow() {
  if (P.dead || state !== 'play') return;
  const d = Math.min(P.x, W - P.x), k = clamp(1 - d / 60, 0, 1);
  if (k <= 0) return;
  for (const side of [0, 1]) {
    const x0 = side ? W : 0, gr = ctx.createLinearGradient(x0, 0, side ? W - 18 : 18, 0);
    gr.addColorStop(0, `rgba(160,255,230,${0.55 * k})`); gr.addColorStop(1, 'rgba(160,255,230,0)');
    ctx.fillStyle = gr;
    ctx.fillRect(side ? W - 18 : 0, P.y - 70, 18, 140);
  }
}
function drawTrail() {
  if (P.dead || state === 'dying') return;
  let pts = trail;
  for (let i = pts.length - 1; i > 0; i--) {
    if (Math.abs(pts[i].x - pts[i - 1].x) > W / 2) { pts = pts.slice(i); break; }   // cut at the screen wrap
  }
  const n = pts.length;
  if (n < 3) return;
  const head = pts[n - 1], tail = pts[0];
  if (Math.hypot(head.x - tail.x, head.y - tail.y) < 12) return;   // barely moving: no ribbon
  const L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x, ty = b.y - a.y; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
    const w = P.r * 0.7 * (i / (n - 1));
    L.push([pts[i].x - ty * w, pts[i].y + tx * w]); R.push([pts[i].x + ty * w, pts[i].y - tx * w]);
  }
  const col = comboCol(), ta = 0.34 * clamp(-P.vy / 500, 0, 1);   // only while rising
  if (ta < 0.02) return;
  const gr = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
  gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(1, `rgba(${col},${ta})`);
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath(); ctx.fill();
}

function drawPlayer(x, y) {
  const r = P.r, k = r / 17;   // face & sprout were designed at r=17; scale them with the body
  if (nightK > 0 && !P.dead) glow('150,255,225', x, y, 62, 0.32 * nightK);   // Pip glows softly at night
  if ((combo >= 2 || rushT > 0) && !P.dead) glow(comboCol(), x, y, 44 + Math.min(combo, 8) * 4, 0.35 + Math.min(combo, 8) * 0.04);
  ctx.save();
  ctx.translate(x, y + r);
  ctx.rotate(P.rot);
  const ds = state === 'dying' ? Math.max(0.35, 1 - deathT * 0.7) : 1;   // shrinks into the distance when falling away
  ctx.scale((1 + P.sq) * ds, (1 - P.sq) * ds);
  ctx.translate(0, -r);

  // sprout (behind body); blossoms into a flower during Golden Rush / Skyvine
  const fl = P.flowerK;
  ctx.save(); ctx.translate(0, -r + 3 * k); ctx.scale(k, k); ctx.rotate(clamp(P.sprout * 0.06, -0.8, 0.8));
  ctx.strokeStyle = '#3e9e4a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(1, -6, 0, -11); ctx.stroke();
  const ls = 1 - fl * 0.25;
  ctx.fillStyle = '#7ee36f';
  ctx.save(); ctx.translate(0, -9); ctx.rotate(-0.7 + Math.sin(time * 3) * 0.08 - fl * 0.5);
  ctx.beginPath(); ctx.ellipse(-6 * ls, 0, 7 * ls, 3.6 * ls, 0, 0, TAU); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(0, -9); ctx.rotate(0.7 - Math.sin(time * 3) * 0.08 + fl * 0.5);
  ctx.fillStyle = '#9af08a'; ctx.beginPath(); ctx.ellipse(6 * ls, 0, 7 * ls, 3.6 * ls, 0, 0, TAU); ctx.fill(); ctx.restore();
  if (fl > 0.03) {
    const gold = rushT > 0;
    ctx.save(); ctx.translate(0, -12); ctx.scale(fl, fl); ctx.rotate(time * 1.5);
    for (let i = 0; i < 5; i++) {
      ctx.rotate(TAU / 5);
      ctx.fillStyle = gold ? (i % 2 ? '#ffe27a' : '#ffc23d') : (i % 2 ? '#ffb8e0' : '#ff8fca');
      ctx.beginPath(); ctx.ellipse(0, -5, 3.4, 5.2, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = gold ? '#fff7d6' : '#ffd34d'; ctx.beginPath(); ctx.arc(0, 0, 2.8, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // body
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.1, 0, 0, r * 1.15);
  g.addColorStop(0, '#e6fff5'); g.addColorStop(0.45, '#7deccb'); g.addColorStop(1, '#1f9e8f');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, r - 1, Math.PI * 1.1, Math.PI * 1.6); ctx.stroke();

  // face
  ctx.scale(k, k);
  const lx = clamp(P.vxv / 380, -1, 1) * 3.2, ly = clamp(P.vy / 1300, -1, 1) * 2.4;
  const ink = '#1c3a3f';
  const panic = !P.dead && (state === 'dying' || dangerK > 0.5);
  const mood = P.dead ? 'dead' : panic ? 'panic' : P.happyT > 0 ? 'happy' : rushT > 0 ? 'rush' : vineT > 0 ? 'thrill' : P.vy > 900 ? 'scared' : 'calm';
  ctx.fillStyle = mood === 'happy' || mood === 'rush' ? 'rgba(255,110,150,.6)' : 'rgba(255,120,150,.45)';
  ctx.beginPath(); ctx.ellipse(-10 + lx * 0.5, 4 + ly * 0.4, 3.6, 2.2, 0, 0, TAU); ctx.ellipse(10 + lx * 0.5, 4 + ly * 0.4, 3.6, 2.2, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineWidth = 1.9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ey = -3 + ly;
  if (mood === 'dead') {
    for (const ex of [-6, 6]) { ctx.beginPath(); ctx.moveTo(ex - 3, -5); ctx.lineTo(ex + 3, 1); ctx.moveTo(ex + 3, -5); ctx.lineTo(ex - 3, 1); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 8, 3, 0, TAU); ctx.stroke();
  } else if (mood === 'happy') {
    // ^^ eyes and a big open smile
    for (const ex of [-6, 6]) { ctx.beginPath(); ctx.moveTo(ex - 3.5 + lx, ey + 1.5); ctx.lineTo(ex + lx, ey - 2.5); ctx.lineTo(ex + 3.5 + lx, ey + 1.5); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(lx - 5, 3.5 + ly); ctx.quadraticCurveTo(lx, 11 + ly, lx + 5, 3.5 + ly); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff7b9c'; ctx.beginPath(); ctx.ellipse(lx, 7 + ly, 2.2, 1.4, 0, 0, TAU); ctx.fill();
  } else if (mood === 'rush') {
    // starry golden eyes, confident grin
    for (const ex of [-6, 6]) {
      ctx.beginPath(); ctx.ellipse(ex + lx, ey, 3.6, 4.2, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd34d'; starShape(ex + lx, ey, 2.8, time * 3); ctx.fillStyle = ink;
    }
    ctx.beginPath(); ctx.arc(lx, 3 + ly, 4.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  } else if (mood === 'panic') {
    // wide eyes, tiny pupils, wobbly mouth, sweat drop
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-6 + lx, ey, 4.4, 5, 0, 0, TAU); ctx.ellipse(6 + lx, ey, 4.4, 5, 0, 0, TAU); ctx.fill();
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(-6 + lx, ey + 0.5, 1.6, 0, TAU); ctx.arc(6 + lx, ey + 0.5, 1.6, 0, TAU); ctx.fill();
    ctx.lineWidth = 1.7; ctx.beginPath();
    for (let i = 0; i <= 8; i++) { const mx = lx - 4.5 + i * 1.125, my = 8 + ly + Math.sin(i * 1.6 + time * 30) * 0.9; if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(160,220,255,.9)'; ctx.beginPath(); ctx.moveTo(13, -10); ctx.quadraticCurveTo(16.5, -4, 13, -3); ctx.quadraticCurveTo(9.5, -4, 13, -10); ctx.fill();
  } else {
    const scared = mood === 'scared', thrill = mood === 'thrill';
    const bl = P.blink > 0 && !thrill ? 0.15 : 1;
    const er = scared || thrill ? 4.6 : 4.0;
    ctx.beginPath(); ctx.ellipse(-6 + lx, ey, er * 0.82, er * bl, 0, 0, TAU); ctx.ellipse(6 + lx, ey, er * 0.82, er * bl, 0, 0, TAU); ctx.fill();
    if (bl === 1) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-7 + lx, ey - 1.6, 1.4, 0, TAU); ctx.arc(5 + lx, ey - 1.6, 1.4, 0, TAU); ctx.fill();
    }
    if (scared) { ctx.beginPath(); ctx.ellipse(lx, 7 + ly, 2.4, 3, 0, 0, TAU); ctx.stroke(); }
    else if (thrill) { ctx.fillStyle = ink; ctx.beginPath(); ctx.moveTo(lx - 5, 3 + ly); ctx.lineTo(lx + 5, 3 + ly); ctx.quadraticCurveTo(lx + 4, 11 + ly, lx, 11 + ly); ctx.quadraticCurveTo(lx - 4, 11 + ly, lx - 5, 3 + ly); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(lx, 4 + ly, 4, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  }
  ctx.restore();
}

// ---------- HUD ----------
const hud = document.getElementById('hud');
const altEl = document.getElementById('alt');
const comboEl = document.getElementById('combo');
const seedsEl = document.getElementById('seeds');
const chargesEl = document.getElementById('charges');
const meterEl = document.querySelector('#meter i');
const hintEl = document.getElementById('hint');
const bloomBar = document.getElementById('bloomBar');
// ---- phone buttons (default on touch screens; the pause screen switches to dragging and back) ----
const pad = document.getElementById('pad'), padB = document.getElementById('padB');
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
let padOn = false;
function setControls(mode) {
  padOn = mode === 'buttons' && TOUCH && !BOT;
  pad.hidden = !padOn;
  if (padOn) padB.appendChild(bloomBar); else hud.appendChild(bloomBar);
  padB.classList.toggle('off', TWIST === 'petalless');
  keys.l = keys.r = false;
  for (const b of document.querySelectorAll('.ctrlSwitch button')) b.classList.toggle('on', b.dataset.mode === (padOn ? 'buttons' : 'drag'));
  const c = padOn
    ? ['Hold ◀ ▶ to steer · Middle button: flower', '<b>Hold ◀ ▶</b> to steer', '<b>Middle button</b> grows a rescue flower']
    : ['Drag to steer · Tap to bloom a flower', '<b>Drag</b> to steer', '<b>Tap</b> to bloom a rescue flower'];
  hintEl.innerHTML = T(c[0]);
  document.getElementById('chipSteer').innerHTML = T(c[1]);
  document.getElementById('chipBloom').innerHTML = T(c[2]);
}
// a button that counts as held while any finger is on it (several fingers can work at once)
function holdButton(el, onDown, onUp) {
  const fingers = new Set();
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); audioInit();
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    const first = !fingers.size;
    fingers.add(e.pointerId); el.classList.add('down');
    if (first) { onDown(); buzz(6); }
  });
  const up = e => {
    if (!fingers.delete(e.pointerId) || fingers.size) return;
    el.classList.remove('down');
    if (onUp) onUp();
  };
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, up);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
holdButton(document.getElementById('padL'), () => { keys.l = true; }, () => { keys.l = false; });
holdButton(document.getElementById('padR'), () => { keys.r = true; }, () => { keys.r = false; });
holdButton(padB, () => tryBloom());
function releasePad() { keys.l = keys.r = false; for (const b of pad.querySelectorAll('.down')) b.classList.remove('down'); }
let barActiveT = 0;
function wakeBar(t) { barActiveT = Math.max(barActiveT, t); bloomBar.classList.add('active'); }
const bannerEl = document.getElementById('banner');
const bannerText = document.getElementById('bannerText');
const menuEl = document.getElementById('menu');
const overEl = document.getElementById('over');
const muteBtn = document.getElementById('mute');
// ---- pause ----
const pauseEl = document.getElementById('pause');
const ctrlSwitch = document.getElementById('ctrlSwitch');
ctrlSwitch.hidden = !TOUCH;
ctrlSwitch.addEventListener('click', e => {
  e.stopPropagation();   // choosing controls doesn't resume the game
  const b = e.target.closest('button'); if (!b) return;
  setControls(b.dataset.mode); store('skybloom.controls', b.dataset.mode);
});
function setPaused(on) {
  if (on && state !== 'play') return;
  paused = on;
  pauseEl.classList.toggle('hidden', !on);
  ptrs.clear(); keys.l = keys.r = false;
  if (actx) { if (on) actx.suspend(); else actx.resume(); }
}
document.getElementById('pauseBtn').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('pauseBtn').addEventListener('click', e => { e.stopPropagation(); setPaused(true); });
pauseEl.addEventListener('click', () => setPaused(false));
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !BOT) setPaused(true); });
const FLOWER = '<svg viewBox="0 0 24 24"><g fill="#ff8fca">' +
  [0, 72, 144, 216, 288].map(a => `<ellipse cx="12" cy="6" rx="4" ry="5.5" transform="rotate(${a} 12 12)"/>`).join('') +
  '</g><circle cx="12" cy="12" r="3.6" fill="#ffd34d"/></svg>';
for (let i = 0; i < MAXCH; i++) { const s = document.createElement('div'); s.className = 'slot'; s.innerHTML = FLOWER; chargesEl.appendChild(s); }
const slots = [...chargesEl.children];
let hudDirty = true, lastCharges = -1;
function updateHUD() {
  if (comboFx) {
    comboFx = false;
    comboEl.classList.toggle('gold', rushT > 0);
    if (rushT > 0) {
      comboEl.textContent = T('✨ Golden Rush ×{n}', { n: combo });
      comboEl.classList.add('on'); comboEl.classList.remove('pop'); void comboEl.offsetWidth; comboEl.classList.add('pop');
    } else comboEl.classList.remove('on');
  }
  if (gainFx) wakeBar(1.8);
  if (nopeFx) { nopeFx = false; wakeBar(1.5); chargesEl.classList.remove('shake'); void chargesEl.offsetWidth; chargesEl.classList.add('shake'); }
  if (!hudDirty) return;
  hudDirty = false;
  altEl.innerHTML = `${Math.floor(maxAlt)}<small>${T('m')}</small>`;
  seedsEl.textContent = seedsN;
  slots.forEach((s, i) => {
    s.classList.toggle('full', i < charges);
    if (gainFx && i === charges - 1) { s.classList.remove('gain'); void s.offsetWidth; s.classList.add('gain'); }
  });
  gainFx = false;
  meterEl.style.width = (charges >= MAXCH ? 100 : meter / NEED * 100) + '%';
}
let bannerTimer = 0;
function showBanner(name, sub = T('Now entering')) {
  bannerText.textContent = name;
  document.getElementById('bannerSub').textContent = sub;
  bannerEl.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => bannerEl.classList.remove('show'), 2400);
}
function drawMuteIcon() {
  muteBtn.innerHTML = muted
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#fff"/><path d="m17 9 5 6m0-6-5 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
}
drawMuteIcon();
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());
muteBtn.addEventListener('click', e => {
  e.stopPropagation(); muted = !muted; drawMuteIcon(); audioInit();
  if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, actx.currentTime, 0.05);
  store('skybloom.muted', muted ? '1' : '0');
});
function setMenuBest() {
  const b = DAILY ? dailyBest : best;
  document.getElementById('menuBest').textContent = b > 0 ? T(DAILY ? "Today's best: {n} m" : 'Best climb: {n} m', { n: b }) : '';
}

function startGame(fresh) {
  if (!BOT) audioInit();
  musicDuck(false); paused = false;
  if (fresh) reset();
  state = 'play';
  pixoRun('run-start');
  menuEl.classList.add('hidden'); overEl.classList.add('hidden');
  if (!BOT) hud.classList.remove('hidden');
  hudDirty = true; comboFx = true;
  hintEl.classList.add('on'); hintT = 4.5; wakeBar(4.5);
}
document.getElementById('playBtn').addEventListener('click', () => startGame(false));
document.getElementById('againBtn').addEventListener('click', e => { e.stopPropagation(); startGame(true); });
// tap anywhere to retry — after a short guard so frantic bloom-taps while falling don't skip the results
overEl.addEventListener('click', () => { if (state === 'over' && performance.now() - overShownAt > 700) startGame(true); });

// ---------- input ----------
const ptrs = new Map();
cvs.addEventListener('pointerdown', e => {
  audioInit();
  e.preventDefault();
  if (padOn) return;   // the on-screen buttons do the steering
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  ptrs.set(e.pointerId, { x: e.clientX, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: 0 });
  if (ptrs.size >= 2) { tryBloom(); for (const p of ptrs.values()) p.moved = 999; }
});
cvs.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x; p.x = e.clientX; p.moved += Math.abs(dx);
  if (state === 'play') dragDx += dx / scale * 1.25;
});
function endPtr(e, cancel) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  // only a clean, quick tap blooms, so small steering nudges never waste a flower
  if (!cancel && p.moved < 6 && performance.now() - p.t < 220 && Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 9) tryBloom();
}
cvs.addEventListener('pointerup', e => endPtr(e, false));
cvs.addEventListener('pointercancel', e => endPtr(e, true));
cvs.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.repeat && (e.code === 'Space' || e.code === 'Enter')) return;
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = true;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = true;
  else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (state === 'play') tryBloom(); }
  else if (e.code === 'Enter') { if (paused) setPaused(false); else if (state === 'menu') startGame(false); else if (state === 'over') startGame(true); }
  else if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') setPaused(!paused); }
  else return;
  audioInit();
});
addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
  else if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (!document.hidden && dt > 0 && !paused) {
    dt = Math.min(dt, 1 / 30);
    if (hitstop > 0) { hitstop -= dt; dt *= 0.12; }
    if (state === 'dying' && deathT < 0.35) dt *= 0.45;   // slow-motion beat
    update(dt);
    render();
    updateHUD();
  }
  requestAnimationFrame(frame);
}
// debug helpers: open with #debug, then e.g. __sky.warp(1800)
if (location.hash === '#debug') {
  window.__sky = {
    get state() {
      const b = plats.find(p => p.type === 'bloom');
      return { state, alt: maxAlt | 0, combo, charges, plats: plats.length, camY: camY | 0, vy: P.vy | 0,
        bloom: b ? { follow: !!b.follow, gapBelowFeet: (b.y - P.y - P.r) | 0 } : null };
    },
    onlyBloom() { plats = plats.filter(p => p.type === 'bloom'); },
    warp(mtr) {
      plats = []; seeds = []; brambles = []; drafts = []; pickups = []; vinePts = []; vineT = 0;
      lastDraftY = lastPickY = -mtr * 10;
      P.y = -mtr * 10; P.vy = 0; P.dead = false; P.rot = 0; deathT = 0; camY = P.y - H * 0.5; maxAlt = mtr; state = "play"; menuEl.classList.add("hidden"); overEl.classList.add("hidden"); hud.classList.remove("hidden");
      genY = P.y + P.r + 40; addPlat('leaf', P.x, genY, 90);
      fillWorld(); hudDirty = true;
    },
    drop() { plats = []; },
    god(on = true) { GOD = on; },
    restart() { startGame(true); },
    give(kind) { pickups.push({ kind, x: P.x, y: P.y, ph: 0, alive: true }); },
    rush() { combo = RUSH_EVERY - 1; rushNext = RUSH_EVERY; startRush(); combo = RUSH_EVERY; },
    bramble() { brambles.push({ bx: P.x, x: P.x, y: P.y - 5, amp: 0, ph: 0, sp: 0, alive: true, rot: 0 }); },
    draft() { drafts.push({ x: P.x, w: 76, y: P.y - 300, h: 420 }); },
    get extra() { return { vineT: +vineT.toFixed(2), shield, rushT: +rushT.toFixed(2), drafts: drafts.length, pickups: pickups.length, vinePts: vinePts.length, vy: P.vy | 0, audio: actx ? actx.state : 'none', musicSteps: step }; },
    tap() { tryBloom(); },
  };
}
addEventListener('resize', resize);
resize();
reset();
setMenuBest();
applyLanguage();
{ let mode = null; try { mode = localStorage.getItem('skybloom.controls'); } catch (e) {} setControls(mode || (TOUCH ? 'buttons' : 'drag')); }
if (TWIST === 'petalless') bloomBar.style.display = 'none';
if (DAILY) {
  const chip = document.getElementById('dailyChip');
  chip.style.display = '';
  chip.textContent = T('Daily challenge') + (TWIST ? ' · ' + TWISTS[TWIST][LANG] : '');
}
if (BOT) { menuEl.classList.add('hidden'); setTimeout(() => startGame(false), 600); }
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
